version: '3.8'

services:
  triage:
    build:
      context: .
      dockerfile: services/triage/Dockerfile
    container_name: triage-agent
    ports:
      - "8001:8001"
    environment:
      - TRIAGE_PORT=8001
      - RESOLUTION_URL=http://resolution:8002
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}

  resolution:
    build:
      context: .
      dockerfile: services/resolution/Dockerfile
    container_name: resolution-agent
    ports:
      - "8002:8002"
    environment:
      - RESOLUTION_PORT=8002
      - TRIAGE_URL=http://triage:8001
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}

  saboteur:
    build:
      context: .
      dockerfile: services/saboteur/Dockerfile
    container_name: saboteur-injector
    ports:
      - "8003:8003"
    environment:
      - SABOTEUR_PORT=8003
      - CHAOS_ENABLED=true
      - CHAOS_SEED=12345
